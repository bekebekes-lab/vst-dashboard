name: NeoSales Bot
on:
  schedule:
    # A cada 2h em dias úteis — horário BRT (UTC-3)
    - cron: "0 9,11,13,15,17,19,21,23,1 * * 1-5"
  workflow_dispatch:

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependências Python
        run: pip install -r requirements.txt

      - name: Instalar dependências do sistema para Playwright
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnss3 libnspr4 libatk1.0-0 libatk-bridge2.0-0 \
            libcups2 libdrm2 libxkbcommon0 libxcomposite1 \
            libxdamage1 libxfixes3 libxrandr2 libgbm1 \
            libpango-1.0-0 libcairo2 libasound2t64

      - name: Instalar Playwright + Chromium
        run: playwright install chromium

      - name: Executar bot
        env:
          NEOSALES_USER:      ${{ secrets.NEOSALES_USER }}
          NEOSALES_PASS:      ${{ secrets.NEOSALES_PASS }}
          TOTP_SECRET:        ${{ secrets.TOTP_SECRET }}
          SHEET_ID:           ${{ secrets.SHEET_ID }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: python bot.py

      - name: Salvar artefatos em caso de erro
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-erro
          path: /tmp/neosales/
          retention-days: 3
